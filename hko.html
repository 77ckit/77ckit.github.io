<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HKO 報IN 助手</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #eaeff2; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        /* 深度模擬 天文台 App 風格 */
        .card { width: 340px; background: linear-gradient(180deg, #4a90e2 0%, #16437a 100%); border-radius: 20px; padding: 20px; color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 25px; opacity: 0.8; }
        .loc-name { font-size: 26px; font-weight: bold; text-align: center; margin-bottom: 5px; }
        .temp-row { font-size: 85px; font-weight: 200; text-align: center; margin: 15px 0; position: relative; }
        .unit { font-size: 25px; position: absolute; top: 15px; }
        .status-pill { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 15px; font-size: 18px; margin: 0 auto; display: table; }
        .footer-grid { margin-top: 35px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
        .btn { margin-top: 25px; padding: 12px 30px; background: #16437a; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span id="sys-time">00:00</span>
            <span>我的天文台 (報IN版)</span>
        </div>
        <div class="loc-name" id="place">載入中...</div>
        <div class="temp-row">
            <span id="temp">--</span><span class="unit">°C</span>
        </div>
        <div class="status-pill" id="desc">連接中...</div>
        <div class="footer-grid">
            <div>濕度: <span id="hum">--</span>%</div>
            <div style="text-align: right;">紫外網: 0.2</div>
            <div>更新: <span id="up-time">--</span></div>
            <div style="text-align: right;" id="dist">--</div>
        </div>
    </div>

    <button class="btn" onclick="fetchWeather()">手動刷新</button>

    <script>
        function updateTime() {
            const n = new Date();
            document.getElementById('sys-time').innerText = n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
        }
        setInterval(updateTime, 1000); updateTime();

        async function fetchWeather() {
            const desc = document.getElementById('desc');
            desc.innerText = "刷新中...";
            
            // 使用不同的代理服務器，這通常能解決 GitHub 上的 CORS 問題
            const proxy = "https://corsproxy.io?"; 
            const target = "https://data.weather.gov.hk";
            
            try {
                const response = await fetch(proxy + encodeURIComponent(target));
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                // 數據解析
                const t = data.temperature.data[0]; 
                const h = data.humidity.data[0];
                
                document.getElementById('temp').innerText = t.value;
                document.getElementById('place').innerText = t.place;
                document.getElementById('dist').innerText = t.place;
                document.getElementById('hum').innerText = h.value;
                document.getElementById('up-time').innerText = new Date().toLocaleTimeString('zh-HK',{hour12:false,hour:'2-digit',minute:'2-digit'});
                desc.innerText = "數據已同步";
            } catch (err) {
                desc.innerText = "代理繁忙，請重試";
                console.error("CORS Error:", err);
            }
        }
        window.onload = fetchWeather;
    </script>
</body>
</html>
