<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKO 模擬報IN</title>
    <style>
        :root { --bg-blue: linear-gradient(180deg, #3a7bd5 0%, #00d2ff 100%); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .app-container { width: 340px; background: var(--bg-blue); border-radius: 25px; padding: 20px; color: white; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 30px; opacity: 0.9; }
        .main-info { text-align: center; }
        .location { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .temp-display { font-size: 80px; font-weight: 200; margin: 10px 0; position: relative; display: inline-block; }
        .unit { font-size: 24px; position: absolute; top: 15px; right: -30px; }
        .weather-status { font-size: 18px; margin-top: 10px; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 15px; display: inline-block; }
        .details { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; font-size: 13px; gap: 10px; }
        .btn-update { margin-top: 20px; padding: 10px 20px; border-radius: 8px; border: none; background: #1d4a86; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div id="clock">00:00</div>
            <div>我的天文台 (模擬)</div>
        </div>

        <div class="main-info">
            <div class="location" id="loc-name">正在定位...</div>
            <div class="temp-display">
                <span id="temp-val">--</span><span class="unit">°C</span>
            </div><br>
            <div class="weather-status" id="weather-desc">讀取數據中</div>
        </div>

        <div class="details">
            <div>相對濕度：<span id="humidity">--</span>%</div>
            <div style="text-align: right;">分區：<span id="dist-name">--</span></div>
            <div id="update-time">更新：--:--</div>
            <div style="text-align: right;">數據來源：HKO</div>
        </div>
    </div>

    <button class="btn-update" onclick="getHKOWeather()">刷新數據</button>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function getHKOWeather() {
            const status = document.getElementById('weather-desc');
            // 使用公共代理解決 CORS 限制問題
            const proxy = "https://api.allorigins.win";
            const target = encodeURIComponent("https://data.weather.gov.hk");
            
            try {
                const res = await fetch(proxy + target);
                const rawData = await res.json();
                const data = JSON.parse(rawData.contents); // allorigins 會將結果放在 contents 裡
                
                // 拿取第一個站點數據 (通常是天文台總部)
                const tData = data.temperature.data[0];
                const hData = data.humidity.data[0];
                
                document.getElementById('temp-val').innerText = tData.value;
                document.getElementById('loc-name').innerText = tData.place;
                document.getElementById('dist-name').innerText = tData.place;
                document.getElementById('humidity').innerText = hData.value;
                document.getElementById('update-time').innerText = "更新：" + new Date().getHours().toString().padStart(2, '0') + ":" + new Date().getMinutes().toString().padStart(2, '0');
                status.innerText = "天氣觀測中"; 
            } catch (error) {
                console.error(error);
                status.innerText = "獲取失敗，請重試";
            }
        }

        window.onload = getHKOWeather;
    </script>
</body>
</html>
