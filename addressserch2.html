<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手</title>
    <style>
            <link rel="icon" href="./image/map.png" type="image/png">
            <link rel="apple-touch-icon" href="./image/map.png">
        body { font-family: sans-serif; background: #0078d4; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; width: 90%; }
        .loading-ring { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #timer { font-size: 1.2em; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body onclick="instantJump()">

<div class="box" id="main">
    <h1>正在自動讀取...</h1>
    <div class="loading-ring"></div>
    <p id="statusText">正在檢查剪貼簿內容<br><span id="timer">3</span> 秒後自動跳轉</p>
</div>

<!-- 修正：Action 必須指向 /search 才能執行搜尋 -->
<form id="aiForm" action="https://www.google.com" method="GET" style="display:none;">
    <input type="hidden" name="q" id="qField">
    <input type="hidden" name="udm" value="50">
    <input type="hidden" name="aep" value="11">
</form>

<script>
    const SUFFIX = "\n簡短列出以下三點：不要添加其它文字\n地址查詢\n保安控制室位置\n管理處電話";
    let timeLeft = 3;
    let isExecuted = false; // 防止重複執行

    // 1. 頁面加載後啟動 3 秒倒數
    window.onload = function() {
        const timerDisplay = document.getElementById('timer');
        const interval = setInterval(() => {
            timeLeft--;
            if (timerDisplay) timerDisplay.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(interval);
                autoReadAndSubmit();
            }
        }, 1000);
    };

    // 2. 點擊螢幕立即跳轉功能
    function instantJump() {
        if (isExecuted) return;
        timeLeft = 0;
        autoReadAndSubmit();
    }

    // 3. 核心邏輯：讀取剪貼簿並提交
    async function autoReadAndSubmit() {
        if (isExecuted) return;
        isExecuted = true;

        try {
            // 嘗試自動讀取 (需在 HTTPS 環境下)
            const text = await navigator.clipboard.readText();
            
            if (text && text.trim()) {
                document.getElementById('main').innerHTML = "<h1>已偵測內容</h1><p>正在前往 Google AI...</p>";
                submitSearch(text.trim());
            } else {
                handleFail("剪貼簿是空的，請先複製屋苑名稱！");
            }
        } catch (err) {
            console.error("讀取失敗:", err);
            handleFail("無法讀取剪貼簿 (請確保網址為 HTTPS 並允許權限)");
        }
    }

    function handleFail(msg) {
        const manual = prompt(msg + "\n\n請在此貼上：");
        if (manual && manual.trim()) {
            submitSearch(manual);
        } else {
            isExecuted = false; // 重置狀態允許再次點擊
            document.getElementById('main').innerHTML = "<h1>已停止</h1><p>請複製內容後點擊螢幕重試</p>";
        }
    }

    function submitSearch(keyword) {
        document.getElementById('qField').value = keyword + SUFFIX;
        document.getElementById('aiForm').submit();
    }
</script>

</body>
</html>
